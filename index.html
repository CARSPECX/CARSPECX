<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARSPECX | Home</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div style="display:flex;align-items:center;">
        <img src="static/images/CARSPECX.png" class="logo">
        <span style="color:white;font-weight:bold;font-size:20px;">CARSPECX</span>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h1 class="title">Explore Cars</h1>

<div class="car-grid" id="carList"></div>

<!-- Include app.js -->
<script src="app.js"></script>

<script>
// Fetch and display cars
fetch("CARS.json")
  .then(res => {
      if (!res.ok) throw new Error("HTTP error " + res.status);
      return res.json();
  })
  .then(CARS => {
      let html = "";
      CARS.forEach(CARS => {
          html += `
          <div class="car-card">
              <img src="static/images/${CARS.image}" alt="${CARS.car_name}">
              <h3>${CARS.car_name}</h3>
              <p><b>Brand:</b> ${CARS.brand}</p>
              <p><b>Price:</b> ${formatPrice(CARS.price)}</p>
              <p><b>Fuel:</b> ${CARS.fuel_type}</p>
              <p><b>Transmission:</b> ${CARS.transmission}</p>
              <a href="details.html?id=${CARS.id}" class="btn">View Details</a>
          </div>`;
      });
      document.getElementById("carList").innerHTML = html;
      console.log("Cars displayed:", CARS.length);
  })
  .catch(err => {
      console.error("Failed to load cars.json:", err);
      document.getElementById("carList").innerHTML = "<p style='color:red;text-align:center;'>Failed to load car data. Check console for details.</p>";
  });
</script>
</body>
</html>
