<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARSPECX | Home</title>
<link rel="stylesheet" href="static/style.css">
<style>
#introScreen{
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    animation: fadeOut 1.5s ease forwards;
    animation-delay: 5s;
}

#introScreen img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: zoomIn 6s ease-in-out forwards;
}

@keyframes zoomIn {
    from { transform: scale(1); }
    to { transform: scale(1.15); }
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}
</style>
</head>
<body>
<!-- INTRO SCREEN -->
<div id="introScreen">
    <img src="static/images/intro.png" alt="Intro">
</div>
<!-- NAVBAR -->
<header class="navbar">
    <div style="display:flex;align-items:center;">
        <img src="static/images/CARSPECX.png" class="logo">
        <span style="color:white;font-weight:bold;font-size:20px;">CARSPECX</span>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h1 class="title">Explore Cars</h1>

<div class="car-grid" id="carList"></div>

<!-- Include app.js -->
<script src="app.js"></script>

<script>
fetch("CARS.json")
.then(res => {
    if(!res.ok) throw new Error("Cars.json not found");
    return res.json();
})
.then(cars => {
    let html = "";
    cars.forEach(car => {
        html += `
        <div class="car-card">
            <img src="static/images/${car.image}">
            <h3>${car.car_name}</h3>
            <p><b>Brand:</b> ${car.brand}</p>
            <p><b>Fuel:</b> ${car.fuel_type}</p>
            <p><b>Transmission:</b> ${car.transmission}</p>
            <p><b>Price:</b> ₹${Number(car.price).toLocaleString()}</p>
            <a href="details.html?id=${car.id}" class="btn">View Details</a>
        </div>`;
    });
    document.getElementById("carList").innerHTML = html;
})
.catch(err => {
    document.getElementById("carList").innerHTML =
      "<h3 style='color:red;text-align:center;'>Failed to load car data. Check console.</h3>";
    console.error(err);
});
</script>
    <script>
setTimeout(() => {
    document.getElementById("introScreen").style.display = "none";
}, 6500);
    </script>
</body>
</html>
