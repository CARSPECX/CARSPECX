<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Car Details | CARSPECX</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="navbar">
    <img src="static/images/CARSPECX.png" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h2 class="title">Car Specifications</h2>

<div style="overflow-x:auto;">
  <table class="details-table" id="detailsTable"></table>
</div>

<!-- Include app.js for formatPrice -->
<script src="app.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const carId = parseInt(params.get("id")); // Convert to number

fetch("data/cars.json")
  .then(res => res.json())
  .then(cars => {
      const car = cars.find(c => c.id === carId);
      if(!car) {
          document.getElementById("detailsTable").innerHTML = "<tr><td colspan='2'>Car not found</td></tr>";
          return;
      }

      let html = "";
      for (let key in car) {
          if (key !== "image" && key !== "id") {
              html += `<tr>
                          <th>${key.replace(/_/g,' ')}</th>
                          <td>${key === "price" ? formatPrice(car[key]) : car[key]}</td>
                       </tr>`;
          }
      }
      document.getElementById("detailsTable").innerHTML = html;
  })
  .catch(err => console.error("Failed to load cars.json:", err));
</script>

</body>
