<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Details | CARSPECX</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="navbar">
    <img src="static/images/CARSPECX.png" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h2 class="title">Car Specifications</h2>

<div style="overflow-x:auto;">
  <table class="details-table" id="detailsTable"></table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const carId = params.get("id");

fetch("data/cars.json")
.then(res => {
    if(!res.ok) throw new Error("cars.json not found");
    return res.json();
})
.then(cars => {
    const car = cars.find(c => String(c.id) === String(carId));
    if(!car){
        document.getElementById("detailsTable").innerHTML =
          "<tr><td>Car not found</td></tr>";
        return;
    }

    let html = "";
    for (let key in car) {
        if (key !== "image" && key !== "id") {
            let value = key === "price"
                ? "₹" + Number(car[key]).toLocaleString()
                : car[key];

            html += `
            <tr>
                <th>${key.replace(/_/g,' ').toUpperCase()}</th>
                <td>${value}</td>
            </tr>`;
        }
    }
    document.getElementById("detailsTable").innerHTML = html;
})
.catch(err => {
    document.getElementById("detailsTable").innerHTML =
      "<tr><td style='color:red;'>Failed to load car data</td></tr>";
    console.error(err);
});
</script>

</body>
</html>
