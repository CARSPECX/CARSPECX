<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Details | CARSPECX</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="navbar">
    <img src="static/images/CARSPECX.png" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h2 class="title">Car Specifications</h2>

<div style="text-align:center; margin:15px;">
    <img id="carImage" src="" alt="Car Image" style="
        width: 90%;
        max-width: 600px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    ">
</div>

<div style="overflow-x:auto;">
  <table class="details-table" id="detailsTable"></table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const carId = parseInt(params.get("id"));

fetch("CARS.json")
.then(res => res.json())
.then(cars => {
    const car = cars.find(c => c.id === carId);
    if(!car){
        document.getElementById("detailsTable").innerHTML =
        "<tr><td>Car not found</td></tr>";
        return;
    }

    // Set image
    document.getElementById("carImage").src = "static/images/" + car.image;

    let html = "";
    for (let key in car) {
        if (key !== "image" && key !== "id") {
            let value = car[key];

            // format price directly
            if(key === "price"){
                value = "₹" + Number(value).toLocaleString();
            }

            html += `
              <tr>
                <th>${key.replace(/_/g,' ')}</th>
                <td>${value}</td>
              </tr>`;
        }
    }

    document.getElementById("detailsTable").innerHTML = html;
})
.catch(err => {
    console.error(err);
    document.getElementById("detailsTable").innerHTML =
    "<tr><td>Error loading data</td></tr>";
});
</script>
</body>
</html>
