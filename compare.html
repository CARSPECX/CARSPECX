<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Cars | CARSPECX</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="navbar">
    <img src="static/images/CARSPECX.png" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h2 class="title"> COMPARE CARS </h2>

<div style="display:flex;justify-content:center;gap:20px;margin-bottom:15px;">
    <img id="img1" src="" style="height:140px;display:none;border-radius:8px;">
    <img id="img2" src="" style="height:140px;display:none;border-radius:8px;">
</div>
    
<div class="filter-form">
    <select id="car1"></select>
    <select id="car2"></select>
    <button onclick="compare()"> COMPARE </button>
</div>

<table class="compare-table" id="compareTable"></table>

<script>
let carsData = [];

fetch("data/cars.json")
.then(res => res.json())
.then(cars => {
    carsData = cars;
    loadSelects(cars);
});

function loadSelects(cars){
    let html = `<option value="">Select Car</option>`;
    cars.forEach(c => html += `<option value="${c.id}">${c.car_name}</option>`);
    document.getElementById("car1").innerHTML = html;
    document.getElementById("car2").innerHTML = html;
}

function compare(){
    let id1 = document.getElementById("car1").value;
    let id2 = document.getElementById("car2").value;

    let c1 = carsData.find(c => c.id == id1);
    let c2 = carsData.find(c => c.id == id2);

    if(!c1 || !c2) return;

    // 🔹 Show images
    document.getElementById("img1").src = "static/images/" + c1.image;
    document.getElementById("img2").src = "static/images/" + c2.image;
    document.getElementById("img1").style.display = "block";
    document.getElementById("img2").style.display = "block";

    let html = `<tr>
        <th>SPECIFICATIONS</th>
        <th>${c1.car_name}</th>
        <th>${c2.car_name}</th>
    </tr>`;

    for(let key in c1){
        if(key !== "id" && key !== "image"){
            html += `<tr>
                <td>${key.replace(/_/g,' ')}</td>
                <td>${c1[key]}</td>
                <td>${c2[key]}</td>
            </tr>`;
        }
    }

    document.getElementById("compareTable").innerHTML = html;
}
</script>

</body>
</html>
