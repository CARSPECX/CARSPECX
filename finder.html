<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Finder | CARSPECX</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="navbar">
    <img src="static/images/CARSPECX.png" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="finder.html">Car Finder</a>
        <a href="recommend.html">Recommend</a>
        <a href="compare.html">Compare</a>
        <a href="emi.html">EMI</a>
    </nav>
</header>

<h2 class="title">Find Your Car</h2>

<div class="filter-form">
    <select id="brand"></select>
    <select id="fuel">
        <option value="">Fuel</option>
        <option>Petrol</option>
        <option>Diesel</option>
        <option>Electric</option>
    </select>
    <select id="transmission">
        <option value="">Transmission</option>
        <option>Manual</option>
        <option>Automatic</option>
    </select>
    <input type="number" id="maxPrice" placeholder="Max Price">
    <button onclick="filterCars()">Search</button>
</div>

<div class="car-grid" id="carList"></div>

<script>
let allCars = [];

fetch("data/cars.json")
.then(res => res.json())
.then(cars => {
    allCars = cars;
    loadBrands(cars);
    showCars(cars);
});

function loadBrands(cars){
    let brands = [...new Set(cars.map(c => c.BRAND))];
    let html = `<option value="">Brand</option>`;
    brands.forEach(b => html += `<option>${b}</option>`);
    document.getElementById("brand").innerHTML = html;
}

function showCars(cars){
    let html = "";
    cars.forEach(car => {
        html += `
        <div class="car-card">
            <img src="static/images/${car.IMAGE}">
            <h3>${car.CAR_NAME}</h3>
            <p>${car.BRAND}</p>
            <p>${formatPrice(car.PRICE)}</p>
            <a href="details.html?id=${car.ID}" class="btn">View</a>
        </div>`;
    });
    document.getElementById("carList").innerHTML = html;
}

function filterCars(){
    let brand = document.getElementById("brand").value;
    let fuel = document.getElementById("fuel").value;
    let trans = document.getElementById("transmission").value;
    let maxPrice = parseFloat(document.getElementById("maxPrice").value);

    let filtered = allCars.filter(c =>
        (brand=="" || c.BRAND==brand) &&
        (fuel=="" || c.FUEL_TYPE==fuel) &&
        (trans=="" || c.TRANSMISSION==trans) &&
        (isNaN(maxPrice) || c.PRICE <= maxPrice)
    );

    showCars(filtered);
}
</script>

</body>
</html></body>
</html>
